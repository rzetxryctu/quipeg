[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quipeg"
version = "3.0.0"
description = "Simulate a global quantum internet — QKD networks, quantum repeaters, entanglement swapping, BB84 key rates. Zero dependencies."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Quipeg Contributors", email = "contact@quipeg.org"}
]
keywords = [
    "quantum", "qkd", "quantum-key-distribution", "quantum-internet",
    "quantum-networking", "quantum-repeater", "entanglement", "bell-state",
    "bb84", "fidelity", "cryptography", "quantum-cryptography",
    "entanglement-swapping", "dejmps", "purification", "simulator",
    "network-simulator", "quantum-physics", "quantum-communication",
    "quantum-memory", "decoherence", "t1", "t2", "geojson",
    "visualization", "python", "zero-dependencies"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License Version 2.0",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
quipeg = "quipeg.cli:main"

[project.urls]
Homepage = "https://github.com/quipeg/quipeg"
Documentation = "https://github.com/quipeg/quipeg#readme"
Repository = "https://github.com/quipeg/quipeg"
Issues = "https://github.com/quipeg/quipeg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
